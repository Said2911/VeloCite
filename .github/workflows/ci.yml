name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Python: lint + unit tests (no database needed) ─────────────────────────
  backend:
    name: 🧪 Backend lint & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Ruff
        run: ruff check backend analytics scrapers tests
      - name: Pytest
        run: pytest --cov=backend --cov=analytics --cov-report=term-missing

  # ── C++ engine: build with pybind11 and run its tests ──────────────────────
  cpp:
    name: ⚙️ C++ engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pybind11>=2.12" numpy pytest
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DPython_EXECUTABLE="$(which python)" \
            -Dpybind11_DIR="$(python -m pybind11 --cmakedir)"
          cmake --build build -j"$(nproc)"
      - name: Test
        env:
          PYTHONPATH: build
        run: |
          python -c "import real_estate_engine; print('✅ C++ engine loaded')"
          pytest tests/cpp -v

  # ── Frontend: lint + production build ──────────────────────────────────────
  frontend:
    name: 🖥️ Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Build (includes TypeScript type check)
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8001
        run: npm run build
