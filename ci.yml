name: CI / CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────────────────
# JOB 1 — Lint & Type Check (runs on every PR push, fast feedback)
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  lint:
    name: 🔍 Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python linting tools
        run: pip install ruff mypy

      - name: Ruff lint (Python)
        run: ruff check backend/ analytics/ services/

      - name: Mypy type check
        run: mypy backend/ analytics/ --ignore-missing-imports

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: ESLint (TypeScript/React)
        working-directory: frontend
        run: npm run lint

      - name: TypeScript type check
        working-directory: frontend
        run: npm run type-check

# ─────────────────────────────────────────────────────────────────────────────
# JOB 2 — Python Tests
# ─────────────────────────────────────────────────────────────────────────────
  test-backend:
    name: 🧪 Backend Tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: realestate_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 10s

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/realestate_test
          REDIS_URL: redis://localhost:6379
        run: |
          pytest backend/ analytics/ \
            --cov=backend \
            --cov=analytics \
            --cov-report=xml \
            --cov-report=term-missing \
            -v

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false

# ─────────────────────────────────────────────────────────────────────────────
# JOB 3 — Build C++ Engine
# ─────────────────────────────────────────────────────────────────────────────
  build-cpp:
    name: ⚙️ Build C++ Engine
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ python3-dev pybind11-dev

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: cpp/build
          key: ${{ runner.os }}-cmake-${{ hashFiles('cpp/**/*.cpp', 'cpp/**/*.h', 'CMakeLists.txt') }}

      - name: Configure & Build
        run: |
          mkdir -p cpp/build && cd cpp/build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)

      - name: Smoke test C++ module
        run: |
          cp cpp/build/real_estate_engine*.so .
          python3 -c "import real_estate_engine; e = real_estate_engine.SearchEngine(); print('✅ C++ engine loaded')"

      - name: Upload compiled artifact
        uses: actions/upload-artifact@v4
        with:
          name: cpp-engine-${{ github.sha }}
          path: cpp/build/real_estate_engine*.so
          retention-days: 7

# ─────────────────────────────────────────────────────────────────────────────
# JOB 4 — Frontend Build & Test
# ─────────────────────────────────────────────────────────────────────────────
  test-frontend:
    name: 🖥️ Frontend Build & Test
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        working-directory: frontend
        run: npm ci

      - name: Unit tests (Jest)
        working-directory: frontend
        run: npm test -- --coverage --watchAll=false

      - name: Build Next.js
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8001
          NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
        run: npm run build

# ─────────────────────────────────────────────────────────────────────────────
# JOB 5 — Deploy (only on push to main, all jobs must pass)
# ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: [test-backend, build-cpp, test-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Download C++ artifact
        uses: actions/download-artifact@v4
        with:
          name: cpp-engine-${{ github.sha }}
          path: cpp/build/

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Docker images
        run: |
          docker build -t ghcr.io/${{ github.repository }}/api:${{ github.sha }} \
            --build-arg CPP_SO_PATH=cpp/build/ -f docker/api.Dockerfile .
          docker build -t ghcr.io/${{ github.repository }}/frontend:${{ github.sha }} \
            -f docker/frontend.Dockerfile frontend/
          docker push ghcr.io/${{ github.repository }}/api:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/realestate
            export IMAGE_TAG=${{ github.sha }}
            docker compose pull
            docker compose up -d --no-build
            docker system prune -f
