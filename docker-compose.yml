services:

  # ── PostgreSQL + PostGIS ───────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4
    container_name: velocite_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-velocite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-velocite123}
      POSTGRES_DB: ${POSTGRES_DB:-velocite}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velocite"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ──────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: velocite_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: velocite_api
    environment:
      DATABASE_URL: postgresql://velocite:velocite123@postgres:5432/velocite
      REDIS_URL: redis://redis:6379
      EXCHANGE_RATE_API_URL: https://api.exchangerate-api.com/v4/latest/USD
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
      AUTO_SEED: "true"
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./analytics:/app/analytics

  # ── Next.js Frontend ───────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: velocite_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8001
    ports:
      - "3000:3000"
    depends_on:
      - api

  # ── Nginx Reverse Proxy ────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: velocite_nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api
      - frontend

  # ── Scraper (optional, experimental: docker compose --profile scrapers up) ──
  scraper:
    build:
      context: .
      dockerfile: docker/scraper.Dockerfile
    container_name: velocite_scraper
    profiles: ["scrapers"]
    environment:
      DATABASE_URL: postgresql://velocite:velocite123@postgres:5432/velocite
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    command: python -m scrapers.scheduler

volumes:
  postgres_data:
  redis_data: